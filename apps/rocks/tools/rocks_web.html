<!doctype html>
<meta charset="utf-8">
<title>Rocks</title>
<style>body { margin: 0; background: #e9e9ee; } #ux-canvas { display: block; }</style>
<canvas id="ux-canvas" width="1100" height="720"></canvas>
<script>
  // Rocks in the browser: the WORKER run loop (served cross-origin isolated), the DOM page services
  // from ux_web_page.js.  For run_rocks_web.sh the app's output is POSTed back once it is up.
  globalThis.xccConfig = { runLoop: 'worker', workerScript: 'ux_web_browser.js', canvas: '#ux-canvas' };
  const out = [];
  // Once the app is up, check that its frames really reach the screen: a frame painted, and the
  // window's canvas pane white on it (the worker's drawing, not the page's background).
  const report = () => fetch('/result', { method: 'POST', body: out.join('\n') });
  const checkFrames = (tries) => {
    const d = document.querySelector('canvas.ux-display');
    if (d && (globalThis.uxFrames || 0) > 0) {
      const p = d.getContext('2d').getImageData(600, 400, 1, 1).data;
      out.push(`FRAMES: ${globalThis.uxFrames} painted; canvas pane pixel ${p[0]},${p[1]},${p[2]},${p[3]}`);
      if (!(p[0] === 255 && p[1] === 255 && p[2] === 255 && p[3] === 255)) out.unshift('FAIL: the window is not on screen');
      return report();
    }
    if (tries <= 0) { out.unshift('FAIL: no frame reached the page'); return report(); }
    setTimeout(() => checkFrames(tries - 1), 250);
  };
  globalThis.xccOut = (s) => {
    out.push(s);
    if (/^(PASS|FAIL|SKIP)/.test(s) && location.search.includes('report')) checkFrames(40);
  };
</script>
<script src="ux_web_page.js"></script>
<script src="rocks.js"></script>
